name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::129729741901:role/github-actions-shop-panel-deploy
  S3_BUCKET: shop-panel-demo-danitaillefer

jobs:
  deploy:
    name: Build y subida a S3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run test:run
      - run: npm run build

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Subir a S3
        run: aws s3 sync dist s3://${{ env.S3_BUCKET }} --delete